# Trusted definition only. PRs use azure-pipelines-pr.yml and separate permissions.
# Required pool/image variables and signing prerequisites: docs/azure-pipelines.md.
parameters:
- name: publishPackage
  displayName: Publish the tested package (manual tag runs only)
  type: boolean
  default: false

trigger:
  branches:
    include:
    - master
  tags:
    include:
    - '*'

pr: none

variables:
  PACKAGE_PATCH_OFFSET: '0'

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: $(TRUSTED_POOL_NAME)
      image: $(TRUSTED_POOL_IMAGE)
      os: windows
    sdl:
      sourceAnalysisPool:
        name: $(TRUSTED_SOURCE_ANALYSIS_POOL_NAME)
        image: $(TRUSTED_SOURCE_ANALYSIS_POOL_IMAGE)
        os: windows
      # Validation is not a signer. Administrators must establish signing before
      # enabling production; do not disable this check to make unsigned builds pass.
      codeSignValidation:
        enabled: true
        break: true
    stages:
    - template: eng/pipelines/build.yml@self
      parameters:
        condition: >-
          and(succeeded(),
              eq(variables['Build.Repository.Name'], 'Azure/DatatypeChannels.ASB'),
              in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'),
              or(eq(variables['Build.SourceBranch'], 'refs/heads/master'),
                 startsWith(variables['Build.SourceBranch'], 'refs/tags/')))

    - stage: Integration
      dependsOn: Build
      lockBehavior: sequential
      condition: |
        and(succeeded(),
            eq(variables['Build.Repository.Name'], 'Azure/DatatypeChannels.ASB'),
            in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'),
            or(eq(variables['Build.SourceBranch'], 'refs/heads/master'),
               startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
      jobs:
      - job: Integration
        workspace:
          clean: all
        steps:
        - checkout: self
          clean: true
          fetchDepth: 0
          fetchTags: true
          persistCredentials: false
        - pwsh: |
            dotnet fsi eng/RunPipeline.fsx check-trust
            exit $LASTEXITCODE
          displayName: Require code already on master before Azure login
        - download: current
          artifact: drop
        - task: AzureCLI@2
          displayName: Test against existing Service Bus namespace
          inputs:
            azureSubscription: DatatypeChannels-ASB-Integration
            scriptType: pscore
            scriptLocation: inlineScript
            addSpnToEnvironment: false
            useGlobalConfig: false
            visibleAzLogin: false
            inlineScript: |
              dotnet fsi eng/RunPipeline.fsx test "$(Pipeline.Workspace)/drop"
              exit $LASTEXITCODE
          env:
            SERVICE_BUS_NAMESPACE: $(SERVICE_BUS_NAMESPACE)
        - task: PublishTestResults@2
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: '$(Pipeline.Workspace)/drop/results/*.trx'
            failTaskOnFailedTests: true
            failTaskOnFailureToPublishResults: true
            failTaskOnMissingResultsFile: true

    - ${{ if eq(parameters.publishPackage, true) }}:
      - stage: Release
        dependsOn:
        - Build
        - Integration
        condition: |
          and(succeeded(),
              eq(dependencies.Integration.result, 'Succeeded'),
              eq(variables['Build.Repository.Name'], 'Azure/DatatypeChannels.ASB'),
              eq(variables['Build.Reason'], 'Manual'),
              startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
        variables:
        - group: DatatypeChannels-ASB-Release
        jobs:
        - deployment: Publish
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: drop
              buildType: current
              targetPath: $(Pipeline.Workspace)/drop
          workspace:
            clean: all
          environment: DatatypeChannels-ASB-Release
          strategy:
            runOnce:
              deploy:
                steps:
                - checkout: none
                # 1ES owns download and provenance/signature validation.
                # Release jobs cannot check out source; use tools from this drop.
                - pwsh: |
                    dotnet fsi eng/RunPipeline.fsx publish "$(Pipeline.Workspace)/drop"
                    exit $LASTEXITCODE
                  workingDirectory: $(Pipeline.Workspace)/drop
                  displayName: Publish this run's tested package without rebuilding
                  env:
                    RELEASE_REQUESTED: 'true'
                    NUGET_REPO_URL: $(NUGET_REPO_URL)
                    NUGET_REPO_KEY: $(NUGET_REPO_KEY)
