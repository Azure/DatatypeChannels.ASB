name: public/Azure.DatatypeChannels.ASB
on:
  push:
    branches:
    - master
    tags:
    - "*"
  pull_request_target:
    branches:
    - master
env:
  BUILD_NUMBER: "${{ github.run_number }}"
permissions:
  id-token: write
  contents: read
jobs:
  build:
    if: github.repository == 'Azure/DatatypeChannels.ASB'
    runs-on: ubuntu-latest
    environment: 
      name: build
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Login to Azure
      uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
      with:
        client-id: ${{ secrets.CLIENT_ID }}
        tenant-id: ${{ secrets.TENANT_ID }}
        subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
    - name: Restore tools
      run: dotnet tool restore
    - name: Build
      run: dotnet fsi build.fsx -t ci
      env:
        servicePrincipalId: ${{ secrets.CLIENT_ID }}
    - name: Upload NuGet package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget
        path: out/*.nupkg

  release:
    needs: build
    if: github.repository == 'Azure/DatatypeChannels.ASB' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment: 
      name: release
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - name: Download NuGet package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nuget
        path: out
    - name: Publish
      env:
        NUGET_REPO_KEY: "${{ secrets.NUGET_REPO_KEY }}"
        NUGET_REPO_URL: "${{ vars.NUGET_REPO_URL }}"
      run: dotnet fsi build.fsx -t release
