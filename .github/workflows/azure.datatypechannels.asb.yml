name: public/Azure.DatatypeChannels.ASB
on:
  push:
    branches:
    - master
    tags:
    - "*"
  pull_request_target:
    branches:
    - master
env:
  BUILD_NUMBER: "${{ github.run_number }}"
permissions:
  id-token: write
  contents: read
jobs:
  build:
    if: github.repository == 'Azure/DatatypeChannels.ASB'
    runs-on: ubuntu-latest
    environment: 
      name: build
    steps:
    - name: checkout
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
    - uses: actions/setup-dotnet@4d6c8fcf3c8f7a60068d26b594648e99df24cee3 # v4.0.0
      with:
        global-json-file: global.json
    - name: Login to Azure
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        client-id: ${{ secrets.CLIENT_ID }}
        tenant-id: ${{ secrets.TENANT_ID }}
        subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
    - name: Restore tools
      run: dotnet tool restore
    - name: Build
      run: dotnet fsi build.fsx -t ci
      env:
        servicePrincipalId: ${{ secrets.CLIENT_ID }}
    - name: Upload NuGet package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: nuget
        path: out/*.nupkg

  release:
    needs: build
    if: github.repository == 'Azure/DatatypeChannels.ASB' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment: 
      name: release
    steps:
    - name: checkout
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
    - uses: actions/setup-dotnet@4d6c8fcf3c8f7a60068d26b594648e99df24cee3 # v4.0.0
      with:
        global-json-file: global.json
    - name: Download NuGet package
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: nuget
        path: out
    - name: Publish
      env:
        NUGET_REPO_KEY: "${{ secrets.NUGET_REPO_KEY }}"
        NUGET_REPO_URL: "${{ vars.NUGET_REPO_URL }}"
      run: dotnet fsi build.fsx -t release
